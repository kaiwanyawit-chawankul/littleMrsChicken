<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Mrs Chicken</title>
<style>
  :root { --page:#effbd9; --frame:#a9a883; --restart:#7a7a55; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
         font-family: "Trebuchet MS", "Comic Sans MS", sans-serif; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

           border-radius: 26px / 20px; background: #1fa8fb; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  canvas { width: 100%; height: 100%; display: block; }
  #restart { font: 700 15px inherit; font-family: inherit; color: #fff; background: var(--restart); border: 0; border-radius: 999px; padding: 8px 22px; cursor: pointer; }
  #restart:active { transform: translateY(1px); }
  @media (prefers-color-scheme: dark) { :root { --page:#26301d; --frame:#6d6c52; --restart:#55553d; } }
</style>

const sprite = new Image(), spriteOpen = new Image();

/* ============ canvas + responsive scaling ============ */
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  scale = canvas.width / W;
}
new ResizeObserver(resize).observe(canvas);

/* ============ game state ============ */
let G;
function reset() {
  G = { chickens: [], eggs: [], shells: [], time: 0, laid: 0, score: 0, toast: '', toastT: 0 };
  for (let i = 0; i < C.chicken.start.count; i++)
    G.chickens.push(makeChicken(W / 2 + rnd(-80, 80), H / 2 + rnd(-40, 60), 1));
}
const spriteH = (s = 1) => C.chicken.width * s * (sprite.naturalHeight / sprite.naturalWidth);

function makeChicken(x, y, s) {
  return { x, y, tx: x, ty: y, mode: 'pause', t: rr(C.chicken.pauseMs), s, age: s < 1 ? 0 : 1e9,
           flip: Math.random() < .5, phase: rnd(0, 6.28), layT: 0, layDone: false, pending: 0 };
}
function bounds() {
  const w = C.chicken.width;
  return { x0: C.pad.l + w / 2, x1: W - C.pad.r - w / 2, y0: C.pad.t + spriteH(), y1: H - C.pad.b };
}

/* ============ actions ============ */
function layAll() {
  G.laid++; sfx('cluck');
  for (const c of G.chickens) c.pending = Math.min(C.limits.maxQueuedLays, c.pending + 1);   // every chicken, every hit
}
function spawnEgg(c) {
  const b = bounds(), dir = c.flip ? -1 : 1;   // sprite faces left, so the tail (egg side) is opposite
  const x = clamp(c.x + dir * C.chicken.width * c.s * C.egg.offsetX + rnd(-9, 9), C.pad.l + C.egg.w, W - C.pad.r - C.egg.w);
  G.eggs.push({ x, y: clamp(c.y + rnd(-5, 5), b.y0, b.y1) - C.egg.h / 2 + 6, age: 0, hatchAt: rr(C.egg.hatchDelayMs),
                state: 'egg', ht: 0, flip: Math.random() < .5 });
  G.score++; sfx('pop');   // score = total eggs laid
}

/* ============ update ============ */
function update(dt) {
  G.time += dt; if (G.toastT > 0) G.toastT -= dt;
  const b = bounds();
  for (const c of G.chickens) {
    c.age += dt;
    if (c.mode !== 'lay' && c.pending > 0) { c.pending--; c.mode = 'lay'; c.layT = 0; c.layDone = false; }
    c.s = c.age >= C.chicken.growMs ? 1 : C.chicken.startScale + (1 - C.chicken.startScale) * easeOut(c.age / C.chicken.growMs);
    if (c.mode === 'lay') {
      c.layT += dt;
      if (!c.layDone && c.layT >= C.chicken.layMs * C.chicken.layAtRatio) { c.layDone = true; spawnEgg(c); }
      if (c.layT >= C.chicken.layMs) { c.mode = 'pause'; c.t = rr(C.chicken.pauseMs) * .5; }
    } else if (c.mode === 'pause') {
      c.t -= dt;
      if (c.t <= 0) {
        const a = rnd(0, Math.PI * 2), d = rr(C.chicken.walkDist);
        c.tx = clamp(c.x + Math.cos(a) * d, b.x0, b.x1); c.ty = clamp(c.y + Math.sin(a) * d * .7, b.y0, b.y1);
        c.mode = 'walk';
      }
    } else {
      const dx = c.tx - c.x, dy = c.ty - c.y, dist = Math.hypot(dx, dy), step = C.chicken.speed * dt / 1000;
      if (dist <= step) { c.x = c.tx; c.y = c.ty; c.mode = 'pause'; c.t = rr(C.chicken.pauseMs); }
      else { c.x += dx / dist * step; c.y += dy / dist * step; if (Math.abs(dx) > 1) c.flip = dx > 0; c.phase += dt / 1000 * C.chicken.stepRate; }
    }
  }
  for (let i = G.eggs.length - 1; i >= 0; i--) {
    const e = G.eggs[i];
    if (e.state === 'egg') { e.age += dt; if (e.age >= e.hatchAt) { e.state = 'hatch'; sfx('crack'); } }
    else {
      e.ht += dt;
      if (e.ht >= C.egg.hatchMs) {
        const ch = makeChicken(e.x, e.y + C.egg.h * .3, C.chicken.startScale);
        ch.flip = e.flip; G.chickens.push(ch); sfx('peep');
        G.shells.push({ x: e.x, y: e.y, kind: 'bottom', life: C.egg.shellFadeMs });
        G.shells.push({ x: e.x + (e.flip ? -1 : 1) * C.egg.w * 1.1, y: e.y + C.egg.h * .15, kind: 'cap', life: C.egg.shellFadeMs, rot: rnd(-.3, .3) });
        G.eggs.splice(i, 1);
      }
    }
  }
  for (let i = G.shells.length - 1; i >= 0; i--) if ((G.shells[i].life -= dt) <= 0) G.shells.splice(i, 1);
  // recycle: when the screen is full, the oldest unhatched eggs quietly disappear (score keeps counting, taps never stop working)
  while (G.eggs.length + G.chickens.length > C.limits.maxEntities) {
    const i = G.eggs.findIndex(e => e.state === 'egg');
    if (i >= 0) G.eggs.splice(i, 1); else if (G.eggs.length) G.eggs.shift(); else G.chickens.shift();
  }
}

/* ============ drawing ============ */
function eggPath(rx, ry, part) {                 // part: 'full' | 'bottom' | 'cap'
  ctx.beginPath();
  if (part === 'full') { ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); return; }
  const n = C.egg.teeth, td = ry * C.egg.toothDepth, bottom = part === 'bottom';
  if (bottom) ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI); else ctx.ellipse(0, 0, rx, ry, 0, Math.PI, Math.PI * 2);
  const x0 = bottom ? -rx : rx;                  // arc ends here; zigzag back to the other side
  for (let i = 1; i <= n * 2; i++) {
    const x = x0 + (bottom ? 1 : -1) * (2 * rx) * i / (n * 2);
    ctx.lineTo(x, i % 2 ? -td : 0);
  }
  ctx.closePath();
}
function drawEgg(x, y, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(o.sx || 1, o.sy || 1);
  eggPath(C.egg.w / 2, C.egg.h / 2, o.part || 'full');
  ctx.fillStyle = C.colors.eggFill; ctx.fill();
  ctx.lineWidth = C.egg.line; ctx.lineJoin = 'round'; ctx.strokeStyle = C.colors.eggLine; ctx.stroke();
  ctx.restore();
}
function drawChicken(x, y, s, o = {}) {
  const w = C.chicken.width * s, h = w * sprite.naturalHeight / sprite.naturalWidth;
  ctx.save(); ctx.translate(x, y - (o.bob || 0)); ctx.rotate(o.tilt || 0);
  ctx.scale((o.flip ? -1 : 1) * (o.sx || 1), o.sy || 1);
  ctx.drawImage(o.open ? spriteOpen : sprite, -w / 2, -h, w, h); ctx.restore();
}
function drawChickenEntity(c) {
  const walking = c.mode === 'walk';
  const sw = walking ? Math.sin(c.phase) : 0;
  let sx = 1, sy = 1;
  if (c.mode === 'lay') { const k = Math.sin(Math.min(1, c.layT / C.chicken.layMs) * Math.PI) * C.chicken.laySquash; sx = 1 + k * .6; sy = 1 - k; }
  const lp = c.mode === 'lay' ? c.layT / C.chicken.layMs : 0, open = lp > C.chicken.beakOpen[0] && lp < C.chicken.beakOpen[1];
  drawChicken(c.x, c.y, c.s, { open, flip: c.flip, bob: Math.abs(sw) * C.chicken.bob * c.s, tilt: sw * C.chicken.tilt, sx, sy });
}
function drawEggEntity(e) {
  if (e.state === 'egg') {
    const p = clamp(e.age / C.egg.popMs, 0, 1), k = easeOutBack(p);
    const left = e.hatchAt - e.age, wob = left < C.egg.wobbleMs ? Math.sin(e.age * .035) * C.egg.wobbleAmp * (1 - left / C.egg.wobbleMs * .4) : 0;
    ctx.save(); ctx.translate(0, e.y + C.egg.h / 2); // pivot at the egg's base for wobble & pop
    drawEgg(e.x, -C.egg.h / 2 - Math.sin(p * Math.PI) * 10 * (1 - p), { sx: k, sy: k, rot: wob });
    ctx.restore();
  } else {
    const p = clamp(e.ht / C.egg.hatchMs, 0, 1), rise = (1 - easeOut(p)) * C.egg.h * .55;
    drawChicken(e.x, e.y + C.egg.h * .3 + rise, C.chicken.startScale, { flip: e.flip });
    drawEgg(e.x, e.y, { part: 'bottom' });
  }
}
function drawCounter() {
  const k = C.counter, d = String(G.score).padStart(C.text.counterDigits, '0');
  ctx.font = C.text.counterFont; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = Math.max(k.w, ctx.measureText(d).width + 64), cx = k.x - w / 2, cy = k.y + k.h / 2;  // grows leftwards
  ctx.fillStyle = C.colors.counterBg; ctx.beginPath(); ctx.ellipse(cx, cy, w / 2, k.h / 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.colors.counterText; ctx.fillText(d, cx, cy + 3);
}
function drawToast() {
  if (G.toastT <= 0) return;
  ctx.globalAlpha = clamp(G.toastT / 400, 0, 1); ctx.fillStyle = C.colors.hint; ctx.font = C.text.hintFont;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(G.toast, 24, 48); ctx.globalAlpha = 1;
}
const isTouch = matchMedia('(pointer: coarse)').matches;
function drawHint() {
  if (G.laid > 0) return;
  ctx.fillStyle = C.colors.hint; ctx.font = C.text.hintFont; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(isTouch ? C.text.hintTouch : C.text.hintKey, W / 2, H - 22);
}
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = C.colors.sky; ctx.fillRect(0, 0, W, H);
  for (const s of G.shells) {
    ctx.globalAlpha = clamp(s.life / (C.egg.shellFadeMs * .4), 0, 1);
    drawEgg(s.x, s.y, s.kind === 'cap' ? { part: 'cap', rot: s.rot, sx: .85, sy: .85 } : { part: 'bottom' });
  }
  ctx.globalAlpha = 1;
  const list = [...G.eggs.map(e => ({ y: e.y + C.egg.h / 2, f: () => drawEggEntity(e) })),
                ...G.chickens.map(c => ({ y: c.y, f: () => drawChickenEntity(c) }))].sort((a, b) => a.y - b.y);
  for (const o of list) o.f();
  drawCounter(); drawHint(); drawToast();
}

/* ============ audio (synthesised, no files) ============ */
let actx = null, master = null, noiseBuf = null, muted = !C.audio.enabled; const sfxLast = {};
function initAudio() {                              // must run from a user gesture
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    actx = new AC(); master = actx.createGain(); master.gain.value = C.audio.volume; master.connect(actx.destination);
    const n = Math.floor(actx.sampleRate * .1); noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
}
function sfx(name) {
  if (!actx || muted) return;
  const def = C.audio.sounds[name], now = actx.currentTime;
  if (now - (sfxLast[name] ?? -1) < def.gap / 1000) return;
  sfxLast[name] = now;
  const j = 1 + rnd(-C.audio.pitchJitter, C.audio.pitchJitter);
  for (const L of def.layers) {
    const t0 = now + (L.delay || 0), g = actx.createGain(); let src;
    g.gain.setValueAtTime(L.gain, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + L.dur);
    if (L.noise) {
      src = actx.createBufferSource(); src.buffer = noiseBuf;
      const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = L.hp || 1500; src.connect(f); f.connect(g);
    } else {
      src = actx.createOscillator(); src.type = L.wave;
      src.frequency.setValueAtTime(L.f[0] * j, t0); src.frequency.exponentialRampToValueAtTime(L.f[1] * j, t0 + L.dur); src.connect(g);
    }
    g.connect(master); src.start(t0); src.stop(t0 + L.dur + .02);
  }
}

/* ============ loop + input ============ */
let last = 0;
function frame(t) {
  const dt = Math.min(50, t - last || 16); last = t;
  update(dt); draw(); requestAnimationFrame(frame);
}
addEventListener('keydown', e => {
  if (C.input.layKeys.includes(e.code)) { e.preventDefault(); initAudio(); layAll(); }
  else if (C.input.muteKeys.includes(e.code)) {
    initAudio(); muted = !muted; G.toast = muted ? C.text.soundOff : C.text.soundOn; G.toastT = C.audio.toastMs;
  } else if (C.input.restartKeys.includes(e.code)) reset();
});
addEventListener('keyup', e => { if (C.input.layKeys.includes(e.code)) e.preventDefault(); });
canvas.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); layAll(); });
const btn = document.getElementById('restart');
btn.addEventListener('click', () => { reset(); btn.blur(); });

const loadImg = (img, src) => new Promise(res => { img.onload = res; img.src = src; });
Promise.all([loadImg(sprite, SPRITE_SRC), loadImg(spriteOpen, SPRITE_OPEN_SRC)]).then(() => { reset(); resize(); requestAnimationFrame(frame); });
</script>
